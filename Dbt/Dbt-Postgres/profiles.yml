ticketing:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    local:
      type: postgres
      host: "{{ env_var('PGHOST', 'warehouse-db') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PGUSER', 'warehouse_admin') }}"
      password: "{{ env_var('PGPASSWORD') }}"
      dbname: "{{ env_var('PGDATABASE', 'ticketing_analytics') }}"
      schema: silver
      threads: "{{ env_var('DBT_THREADS', '2') | int }}"
      connect_timeout: 10
      retries: 1
      keepalives_idle: 30
      application_name: ticketing_dbt
      search_path: public

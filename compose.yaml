name: ticketing-elt
x-app: &app
  build:
    context: .
    dockerfile: Docker/Dockerfile
  image: ticketing-elt:4.0-postgres
  environment: &env
    PYTHONPATH: /opt/project:/opt/airflow/plugins
    DATA_DIR: /opt/project/data
    PGHOST: warehouse-db
    PGPORT: '5432'
    PGDATABASE: ticketing_analytics
    PGUSER: warehouse_admin
    PGPASSWORD: ${WAREHOUSE_PASSWORD:-ticketing_local_warehouse_2026}
    AIRBYTE_API_URL: ${AIRBYTE_API_URL:-http://host.docker.internal:8000/api/public/v1}
    AIRBYTE_CLIENT_ID: ${AIRBYTE_CLIENT_ID:-}
    AIRBYTE_CLIENT_SECRET: ${AIRBYTE_CLIENT_SECRET:-}
    AIRBYTE_CONNECTION_ID: ${AIRBYTE_CONNECTION_ID:-}
    AIRBYTE_TIMEOUT_SECONDS: '3600'
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Bind-mounted Python code can change while the scheduler stays alive.
    # Start fresh task interpreters instead of inheriting cached plugin imports.
    AIRFLOW__CORE__EXECUTE_TASKS_NEW_PYTHON_INTERPRETER: 'true'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${AIRFLOW_DB_PASSWORD:-ticketing_local_pg_2026}@airflow-db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__PARALLELISM: '2'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Ho_Chi_Minh
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Ho_Chi_Minh
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-ticketing-elt-local-session-key}
  volumes:
    - ./Runtime/data:/opt/project/data
    - ./Airflow/dags:/opt/airflow/dags:ro
    - ./Airflow/dags:/opt/project/ticketing_workflows:ro
    - ./Dbt/Dbt-Postgres:/opt/project/dbt:ro
    - ./Airflow/plugins:/opt/airflow/plugins:ro
    - airflow-logs:/opt/airflow/logs
  extra_hosts: ['host.docker.internal:host-gateway']
services:
  warehouse-db:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: ticketing_analytics
      POSTGRES_USER: warehouse_admin
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-ticketing_local_warehouse_2026}
      AIRBYTE_DB_PASSWORD: ${AIRBYTE_DB_PASSWORD:-ticketing_local_loader_2026}
      BI_PASSWORD: ${BI_PASSWORD:-ticketing_local_bi_2026}
    ports: ['127.0.0.1:5433:5432']
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./Postgres/sql/init_warehouse.sql:/docker-entrypoint-initdb.d/01-warehouse.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U warehouse_admin -d ticketing_analytics']
      interval: 5s
      retries: 20
  airflow-db:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-ticketing_local_pg_2026}
    volumes: [airflow-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d airflow']
      interval: 5s
      retries: 20
  airflow-init:
    <<: *app
    environment:
      <<: *env
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-ticketing_local_airflow_2026}
    command: bash -c 'airflow db migrate && python -m ticketing.init_airflow'
    depends_on:
      airflow-db: {condition: service_healthy}
  airflow-webserver:
    <<: *app
    command: ["webserver", "--pid", "/tmp/airflow-webserver/webserver.pid"]
    tmpfs:
      - /tmp/airflow-webserver:uid=50000,gid=0,mode=0770
    restart: unless-stopped
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/health]
      interval: 15s
      retries: 20
  airflow-scheduler:
    <<: *app
    command: scheduler
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      warehouse-db: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'airflow jobs check --job-type SchedulerJob --allow-multiple --limit 5']
      interval: 30s
      timeout: 20s
      retries: 5
  dbt-postgres:
    <<: *app
    profiles: [tools]
    entrypoint: [python, -m, ticketing.dbt_runner]
    command: [debug]
    depends_on:
      warehouse-db: {condition: service_healthy}
volumes:
  warehouse-data:
  airflow-data:
  airflow-logs:
